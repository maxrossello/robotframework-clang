context:
  version: "1.2.0"

package:
  name: robotframework-clang
  version: ${{ version }}

source:
  path: ..
  use_gitignore: true

build:
  number: 0
  script: 
    - ${{ PYTHON }} -m pip install . --no-deps -vv
  string: "${{ target_platform | replace('-', '_') }}_py${{ python | replace('.', '') | replace('*', '') }}_h${{ hash }}"

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
  host:
    - python ${{ python }}
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python ${{ python }}
    - robotframework
    - robotframework-pabot
    - jupyter_client
    - docutils
    - xeus-cpp
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - if: osx
      then: libcxx-devel

tests:
  - script:
      - jupyter kernelspec list
      - if: not win
        then:
          - pabot --testlevelsplit -X --extension rst docs/tests.rst
    files:
      source:
        - docs
    requirements:
      run:
        - ${{ compiler('cxx') }}
        - ${{ stdlib("c") }}
        - if: osx
          then: libcxx-devel

about:
  homepage: https://github.com/maxrossello/robotframework-clang
  license: Apache-2.0
  license_file: LICENSE
  summary: Robot Framework library for Clang-REPL execution via xeus-cpp
  description: |
    robotframework-clang is a Robot Framework library designed to execute 
    and test C++ code interactively using Clang-REPL (via the xeus-cpp extension).
    It allows for JIT compilation, state persistence across tests, and full 
    support for modern C++ features.

extra:
  recipe-maintainers:
    - maxrossello
